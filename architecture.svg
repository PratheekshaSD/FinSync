<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FinSync Architecture Diagram</title>
<desc>Flowchart showing how FinSync components connect — from data sources through reconciliation engine to outputs</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; fill: #1a1a1a; }
    .th { font-size: 14px; font-weight: 600; }
    .ts { font-size: 12px; fill: #444; }
    .arr { stroke: #888; stroke-width: 1.2; fill: none; }
  </style>
</defs>

<!-- DATA SOURCES label -->
<text class="ts" x="340" y="28" text-anchor="middle" fill="#666">Data sources</text>

<!-- Razorpay records -->
<rect x="40" y="40" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="120" y="61" text-anchor="middle" fill="#085041">Razorpay records</text>
<text class="ts" x="120" y="79" text-anchor="middle" fill="#0F6E56">razorpay_records.csv</text>

<!-- Bank statement -->
<rect x="260" y="40" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="340" y="61" text-anchor="middle" fill="#085041">Bank statement</text>
<text class="ts" x="340" y="79" text-anchor="middle" fill="#0F6E56">bank_statement.csv</text>

<!-- Settlement report -->
<rect x="480" y="40" width="160" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="560" y="61" text-anchor="middle" fill="#085041">Settlement report</text>
<text class="ts" x="560" y="79" text-anchor="middle" fill="#0F6E56">settlement_report.csv</text>

<!-- Arrows from sources to reconcile.py -->
<line x1="120" y1="88" x2="220" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="88" x2="340" y2="172" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="88" x2="460" y2="172" class="arr" marker-end="url(#arrow)"/>

<!-- CORE ENGINE -->
<rect x="180" y="175" width="320" height="110" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="340" y="201" text-anchor="middle" fill="#26215C">reconcile.py — core engine</text>
<text class="ts" x="340" y="221" text-anchor="middle" fill="#534AB7">ID normalization · duplicate detection</text>
<text class="ts" x="340" y="239" text-anchor="middle" fill="#534AB7">fuzzy merchant match · risk priority</text>
<text class="ts" x="340" y="257" text-anchor="middle" fill="#534AB7">settlement resolution</text>

<!-- Streamlit box -->
<rect x="30" y="175" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text class="th" x="95" y="198" text-anchor="middle" fill="#042C53">app.py</text>
<text class="ts" x="95" y="216" text-anchor="middle" fill="#185FA5">Streamlit frontend</text>
<line x1="160" y1="203" x2="178" y2="230" class="arr" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

<!-- Arrows from engine to agent + audit -->
<line x1="255" y1="285" x2="155" y2="352" class="arr" marker-end="url(#arrow)"/>
<line x1="425" y1="285" x2="525" y2="352" class="arr" marker-end="url(#arrow)"/>

<!-- agent.py -->
<rect x="40" y="355" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="140" y="378" text-anchor="middle" fill="#412402">agent.py</text>
<text class="ts" x="140" y="396" text-anchor="middle" fill="#854F0B">Gemini AI · exception analysis</text>

<!-- audit.py -->
<rect x="440" y="355" width="200" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/>
<text class="th" x="540" y="378" text-anchor="middle" fill="#412402">audit.py</text>
<text class="ts" x="540" y="396" text-anchor="middle" fill="#854F0B">Timestamped audit trail</text>

<!-- Arrows from agent + audit to report.py -->
<line x1="170" y1="411" x2="285" y2="452" class="arr" marker-end="url(#arrow)"/>
<line x1="510" y1="411" x2="395" y2="452" class="arr" marker-end="url(#arrow)"/>

<!-- report.py -->
<rect x="220" y="455" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="340" y="478" text-anchor="middle" fill="#4A1B0C">report.py</text>
<text class="ts" x="340" y="496" text-anchor="middle" fill="#993C1D">Terminal report · CSV export</text>

</svg>
